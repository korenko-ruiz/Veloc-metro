<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Velocímetro</title>
<meta name="theme-color" content="#0A0A0B" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app" class="theme-auto">

  <!-- Barra superior -->
  <header class="topbar safe-top">
    <button id="btnMenu" class="icon-btn" aria-label="Abrir menú">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <h1 class="title">Velocímetro</h1>
    <div class="topbar-actions">
      <button id="btnTheme" class="icon-btn" aria-label="Cambiar tema">
        <svg id="themeIconSun" viewBox="0 0 24 24" class="hidden"><circle cx="12" cy="12" r="4"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        <svg id="themeIconMoon" viewBox="0 0 24 24" class="hidden"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
        <svg id="themeIconAuto" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A8 8 0 0 1 12 2z"/></svg>
      </button>
      <button id="btnHistory" class="icon-btn" aria-label="Historial de viajes">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>
  </header>

  <!-- Estado GPS -->
  <div class="gps-status">
    <svg viewBox="0 0 20 14" class="signal-icon"><rect x="0" y="9" width="3" height="5" rx="0.5"/><rect x="5.5" y="6" width="3" height="8" rx="0.5"/><rect x="11" y="3" width="3" height="11" rx="0.5"/><rect x="16.5" y="0" width="3" height="14" rx="0.5"/></svg>
    <span id="gpsStatus">GPS: Buscando…</span>
  </div>

  <!-- Reloj / temperatura -->
  <div class="readout-row">
    <span class="readout-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg><span id="clock">--:--</span></span>
    <span class="readout-item"><svg viewBox="0 0 24 24"><path d="M12 3a2 2 0 0 0-2 2v8.3a4 4 0 1 0 4 0V5a2 2 0 0 0-2-2z" stroke="currentColor" stroke-width="1.6" fill="none"/></svg><span id="temp">-- °C</span></span>
  </div>

  <!-- Zona del velocímetro -->
  <div id="gaugeWrap" class="gauge-wrap">
    <canvas id="analogGauge" width="600" height="600"></canvas>
    <div id="digitalGauge" class="digital-gauge hidden">
      <span id="digitalSpeedVal">0</span>
      <span class="unit">k m / h</span>
    </div>
  </div>

  <!-- Odómetro + selector -->
  <div class="odometer-row">
    <div class="odometer">
      <span id="odometerBig" class="odo-big">000000</span><span class="odo-small">.<span id="odometerDec">0</span> km</span>
    </div>
    <div class="odometer-actions">
      <button id="btnSplit" class="split-btn" aria-label="Mostrar mapa en vivo">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.3"/><rect x="14" y="3" width="7" height="7" rx="1.3"/><rect x="3" y="14" width="7" height="7" rx="1.3"/><rect x="14" y="14" width="7" height="7" rx="1.3"/></svg>
      </button>
      <button id="btnGaugeMode" class="mode-pill" aria-label="Cambiar tipo de velocímetro">
        <svg viewBox="0 0 24 24"><path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13v6a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="6.5" cy="14.5" r="1.3"/><circle cx="17.5" cy="14.5" r="1.3"/></svg>
        <span id="gaugeModeLabel">Analógica</span>
        <svg class="chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </div>
  </div>

  <!-- Franja de control: reset · timer · acciones -->
  <div class="control-row">
    <button id="btnReset" class="reset-btn" aria-label="Reiniciar viaje actual">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
    </button>
    <span id="timerVal" class="timer mono">00:00:00</span>
    <div class="control-icons">
      <button id="btnWaze" class="ctrl-icon" aria-label="Abrir Waze">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="18" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M7.5 7C9 9 8 12 12 12s3 3 4.5 5" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button id="btnAlert" class="ctrl-icon" aria-label="Alerta de velocidad">
        <svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v3.5L4 17h16l-2-4.5V9a6 6 0 0 0-6-6z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/><path d="M10 19.5a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.7" fill="none"/></svg>
      </button>
      <button id="btnMap" class="ctrl-icon" aria-label="Ver mapa completo">
        <svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      </button>
      <button id="btnMusic" class="ctrl-icon" aria-label="Reproductor de música">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="19" r="2.3" stroke="currentColor" stroke-width="1.7" fill="none"/><circle cx="19" cy="16.5" r="2.3" stroke="currentColor" stroke-width="1.7" fill="none"/></svg>
      </button>
    </div>
  </div>

  <!-- Estadísticas -->
  <div class="stats-grid">
    <div class="stat">
      <span id="statDistance" class="mono">0.00</span>
      <span class="stat-label">km</span>
      <span class="stat-label">Distancia</span>
    </div>
    <div class="stat">
      <span id="statAvg" class="mono">0</span>
      <span class="stat-label">km/h</span>
      <span class="stat-label">Vel. prom.</span>
    </div>
    <div class="stat">
      <span id="statMax" class="mono">0</span>
      <span class="stat-label">km/h</span>
      <span class="stat-label">Vel. máx.</span>
    </div>
  </div>

  <!-- Botón principal -->
  <button id="btnStart" class="start-btn">
    <span id="startLabel">COMIENZO</span>
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>

  <!-- Mapa en vivo (vista dividida, en línea, con scroll) -->
  <section id="mapPane" class="map-pane hidden">
    <div class="map-pane-header">
      <span>Mapa en vivo</span>
      <button id="btnCloseMapPane" class="icon-btn close-btn" aria-label="Cerrar mapa en vivo">&times;</button>
    </div>
    <div id="map" class="map-inline"></div>
  </section>

</div>

<!-- Menú lateral -->
<div id="drawer" class="overlay overlay--side hidden">
  <div class="drawer-card safe-top safe-bottom">
    <div class="drawer-header">
      <span>Menú</span>
      <button class="icon-btn close-btn" data-close="drawer" aria-label="Cerrar menú">&times;</button>
    </div>
    <button id="drawerHistory" class="drawer-item">Historial de viajes</button>
    <button id="drawerResetOdo" class="drawer-item">Reiniciar odómetro total</button>
    <button id="drawerAbout" class="drawer-item">Acerca de VelociGPS</button>
  </div>
</div>

<!-- OVERLAY: Historial -->
<div id="panelHistory" class="overlay hidden">
  <div class="overlay-card">
    <header class="overlay-header safe-top">
      <h2>Historial de viajes</h2>
      <button class="icon-btn close-btn" data-close="panelHistory" aria-label="Cerrar historial">&times;</button>
    </header>
    <div class="overlay-body">
      <div class="history-filter">
        <input type="date" id="historyDateFilter" />
        <button id="btnClearFilter" class="text-btn">Limpiar</button>
      </div>
      <ul id="tripList" class="trip-list"></ul>
      <p id="tripEmpty" class="empty-msg hidden">Todavía no hay viajes guardados.</p>
    </div>
  </div>
</div>

<!-- OVERLAY: Mapa completo -->
<div id="panelMap" class="overlay hidden">
  <div class="overlay-card overlay-card--full">
    <header class="overlay-header safe-top">
      <h2>Mapa</h2>
      <button class="icon-btn close-btn" data-close="panelMap" aria-label="Cerrar mapa">&times;</button>
    </header>
    <div id="mapFull" class="map-full"></div>
  </div>
</div>

<!-- OVERLAY: Música -->
<div id="panelMusic" class="overlay hidden">
  <div class="overlay-card">
    <header class="overlay-header safe-top">
      <h2>Música</h2>
      <button class="icon-btn close-btn" data-close="panelMusic" aria-label="Cerrar música">&times;</button>
    </header>
    <div class="overlay-body">
      <div class="tabs" role="tablist">
        <button class="tab-btn active" data-tab="files">Mis archivos</button>
        <button class="tab-btn" data-tab="streaming">Streaming</button>
      </div>

      <div id="tabFiles" class="tab-panel">
        <input type="file" id="filePicker" accept="audio/*" multiple hidden />
        <button id="btnAddFiles" class="text-btn">+ Agregar audio del dispositivo</button>
        <ul id="playlist" class="playlist"></ul>
        <div id="playerBar" class="player-bar hidden">
          <button id="btnPlayPause" class="icon-btn" aria-label="Reproducir o pausar">
            <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <span id="nowPlaying" class="now-playing">—</span>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" aria-label="Volumen" />
        </div>
        <audio id="audioEl"></audio>
      </div>

      <div id="tabStreaming" class="tab-panel hidden">
        <div id="streamingPresets" class="streaming-grid"></div>
        <button id="btnAddCustomApp" class="text-btn">+ Agregar app personalizada</button>
        <ul id="customApps" class="custom-app-list"></ul>
      </div>
    </div>
  </div>
</div>

<!-- OVERLAY: Alerta de velocidad -->
<div id="panelAlert" class="overlay hidden">
  <div class="overlay-card overlay-card--small">
    <header class="overlay-header safe-top">
      <h2>Alerta de velocidad</h2>
      <button class="icon-btn close-btn" data-close="panelAlert" aria-label="Cerrar alerta">&times;</button>
    </header>
    <div class="overlay-body">
      <label class="alert-toggle">
        <input type="checkbox" id="alertEnabled" />
        <span>Activar alerta sonora</span>
      </label>
      <label class="alert-limit-label" for="alertLimit">Límite (km/h)</label>
      <input type="number" id="alertLimit" min="10" max="300" step="5" value="110" />
      <div class="preset-row">
        <button class="preset-btn" data-limit="80">80</button>
        <button class="preset-btn" data-limit="100">100</button>
        <button class="preset-btn" data-limit="110">110</button>
        <button class="preset-btn" data-limit="120">120</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
